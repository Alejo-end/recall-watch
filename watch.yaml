# Recall Watch: how fast approved public pages catch up with an official notice.
# (The section keeps its first name, `afterimage`, which the code reads.)
# Every scrape and monitor run spends Context.dev credits, so the pilot is bounded on purpose.
afterimage:
  # Only these domains can be watched. In a pilot, the retailer or brand owner approves this list.
  allowed_domains: [arla.fi, k-ruoka.fi, s-kaupat.fi, foodie.fi, kesko.fi, valio.fi, atria.fi]
  # The service level agreement (SLA) the compliance lead measures: purchase path closed within this time.
  sla_hours: 4
  max_cases: 20
  max_targets_per_case: 10
  # Each new page gets a Context.dev page monitor (1 credit per run, every 10 minutes).
  create_monitors: true
  monitor_interval_minutes: 10
  # Fallback: re-read a page that no monitor reported for this long. 5 credits per read.
  recheck_minutes: 60
  # A person can re-read one page at most this often.
  min_rescrape_seconds: 300
  scrape_budget_per_hour: 60
  # The case the screen opens on. The chili case is the strongest: the recalling company's own shop
  # still lists the product under the official GTIN.
  featured_notice_url: https://www.ruokavirasto.fi/elintarvikkeet/ohjeita-kuluttajille/takaisinvedot-2023-/pakastetussa-chilissa-kadmiumylitys/
  # The live case opened on first start when a Context.dev key is set. The URLs were found with
  # Context.dev search on 14 November 2026, limited to the domains above.
  seed_case:
    notice_url: https://www.ruokavirasto.fi/elintarvikkeet/ohjeita-kuluttajille/takaisinvedot-2023-/proteiinivanukkaissa-mahdollisesti-lasinsiruja/
    targets:
      - {url: "https://www.arla.fi/tuotteet/arla-protein-vanilja-vanukas-laktoositon-200g-688729/", publisher: Arla, page_type: Manufacturer product page,
         found: "Context.dev search for “Arla Protein vanilja vanukas 200g laktoositon” limited to the approved domains, 14 Nov 2026, about 19:35. Rank 1 of 10. Approved by the team for the pilot."}
      - {url: "https://www.s-kaupat.fi/tuote/arla-protein-vanilja-vanukas-200g-laktoositon/5711953200496", publisher: S-kaupat, page_type: Retailer product page,
         found: "Context.dev search for “Arla Protein vanilja vanukas 200g laktoositon” limited to the approved domains, 14 Nov 2026, about 19:35. Rank 2 of 10. Approved by the team for the pilot."}
      - {url: "https://www.k-ruoka.fi/kauppa/tuote/arla-protein-vanukas-200g-vanilja-lton-5711953200496", publisher: K-Ruoka, page_type: Retailer product page,
         found: "Context.dev search for “Arla Protein vanilja vanukas 200g laktoositon” limited to the approved domains, 14 Nov 2026, about 19:35. Rank 3 of 10. Approved by the team for the pilot."}
